[FREELOADER]
DefaultOS=LibreNT
TimeOut=3

[Display]
TitleText=LibreNT
MinimalUI=Yes

[Operating Systems]
LibreNT="LibreNT"
; ROSCONFIG_PROFILE_OS_ENTRIES

[LibreNT]
BootType=Windows2003
SystemPath=partition(2)\Windows
BootLogo=LibreNT
Options=/KERNEL=ntkrnlmp.exe /FASTDETECT /KDWATCHDOG=0

; ROSCONFIG_PROFILE_BOOT_ENTRIES
